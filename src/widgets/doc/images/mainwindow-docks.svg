<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="480"
   height="320"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

<style>
  svg .line-style { stroke: black; fill: none }
  svg .text-style { font: 14px arial; fill: black }
  svg .tb-style { stroke: black; fill: #e0e0e0 }
  svg .dw-style { stroke: black; fill: white }
  svg .cw-style { stroke: black; fill: #f0c8c8 }

  svg.dark .line-style { stroke: #f2f2f2; fill: none }
  svg.dark .text-style { font: 14px arial; fill: #f2f2f2 }
  svg.dark .tb-style { stroke: #f2f2f2; fill: #606060 }
  svg.dark .dw-style { stroke: #f2f2f2; fill: #303030 }
  svg.dark .cw-style { stroke: #f2f2f2; fill: #603030 }

  [data-theme="dark"] svg .line-style { stroke: #f2f2f2; fill: none }
  [data-theme="dark"] svg .text-style { font: 14px arial; fill: #f2f2f2 }
  [data-theme="dark"] svg .tb-style { stroke: #f2f2f2; fill: #606060 }
  [data-theme="dark"] svg .dw-style { stroke: #f2f2f2; fill: #303030 }
  [data-theme="dark"] svg .cw-style { stroke: #f2f2f2; fill: #603030 }

  [data-theme="light"] svg .line-style { stroke: black; fill: none }
  [data-theme="light"] svg .text-style { font: 14px arial; fill: black }
  [data-theme="light"] svg .tb-style { stroke: black; fill: #e0e0e0 }
  [data-theme="light"] svg .dw-style { stroke: black; fill: white }
  [data-theme="light"] svg .cw-style { stroke: black; fill: #f0c8c8 }
</style>

<rect x="5.5" y="5.5" width="470" height="310"
   stroke="black" fill="#e0e0e0" class="tb-style" />
<text
   x="210.5" y="25.5"
   font-family="arial" font-size="14px" stroke="none" fill="black"
   class="text-style">Toolbars</text>

<rect x="35.5" y="35.5" width="410" height="250"
   stroke="black" fill="white" class="dw-style" />
<text x="195.5" y="60.5"
   font-family="arial" font-size="14px" stroke="none" fill="black"
   class="text-style">Dock windows</text>

<rect x="80.5" y="75.5" width="320" height="170"
   stroke="black" fill="#f0c8c8" class="cw-style" />
<text x="195.5" y="160.5"
   font-family="arial" font-size="14px" stroke="none" fill="black"
   class="text-style">Central widget</text>

<path d="m 80.5,35.5 l 0,40 l -45,0"
      stroke="black" fill="none" stroke-dasharray="3,3"
      class="line-style" />
<path d="m 400.5,35.5 l 0,40 l 45,0"
      stroke="black" fill="none" stroke-dasharray="3,3"
      class="line-style" />
<path d="m 35.5,245.5 l 45,0 l 0,40"
      stroke="black" fill="none" stroke-dasharray="3,3"
      class="line-style" />
<path d="m 445.5,245.5 l -45,0 l 0,40"
      stroke="black" fill="none" stroke-dasharray="3,3"
      class="line-style" />

</svg>
