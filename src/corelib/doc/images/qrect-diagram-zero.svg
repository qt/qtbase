<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="350"
   height="250"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

<style>
  svg .line-style { stroke: black; fill: none; stroke-width: 1 }
  svg .high-style { stroke: red; fill: none; stroke-width: 2 }
  svg .text-style { font: 20px arial; fill: black }
  svg .fill-style { stroke: none; fill: red }
  svg .fn-text-style { font: 12px monospace; fill: black }

  svg.dark .line-style { stroke: #f2f2f2; fill: none; stroke-width: 1 }
  svg.dark .high-style { stroke: orange; fill: none; stroke-width: 2 }
  svg.dark .text-style { font: 20px arial; fill: #f2f2f2 }
  svg.dark .fill-style { stroke: none; fill: orange }
  svg.dark .fn-text-style { font: 12px monospace; fill: #f2f2f2 }

  [data-theme="dark"] svg .line-style { stroke: #f2f2f2; fill: none; stroke-width: 1 }
  [data-theme="dark"] svg .high-style { stroke: orange; fill: none; stroke-width: 2 }
  [data-theme="dark"] svg .text-style { font: 20px arial; fill: #f2f2f2 }
  [data-theme="dark"] svg .fill-style { stroke: none; fill: orange }
  [data-theme="dark"] svg .fn-text-style { font: 12px monospace; fill: #f2f2f2 }

  [data-theme="light"] svg .line-style { stroke: black; fill: none; stroke-width: 1 }
  [data-theme="light"] svg .high-style { stroke: red; fill: none; stroke-width: 2 }
  [data-theme="light"] svg .text-style { font: 20px arial; fill: black }
  [data-theme="light"] svg .fill-style { stroke: none; fill: red }
  [data-theme="light"] svg .fn-text-style { font: 12px monospace; fill: black }
</style>

<g transform="translate(-22,30)">
<path d="m 110.5,165.5 v 22 h 70" stroke="black" fill="none" stroke-width="1"
      class="line-style" />
<path d="m 318.5,165.5 v 22 h -70" stroke="black" fill="none" stroke-width="1"
      class="line-style" />
<path d="m 94.5,154.5 h -29 v -50" stroke="black" fill="none" stroke-width="1"
      class="line-style" />
<path d="m 65.5,73.5 v -60 h 32" stroke="black" fill="none" stroke-width="1"
      class="line-style" />
<path d="m 110.5,12.5 h 209 v 142 h -209 z" stroke="red" fill="none" stroke-width="2"
      class="high-style" />

<text x="191" y="192" font-family="monospace" font-size="12px"
      class="fn-text-style">width()</text>
<text x="35" y="93" font-family="monospace" font-size="12px"
      class="fn-text-style">height()</text>
</g>
</svg>
