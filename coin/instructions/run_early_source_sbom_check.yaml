type: Group
instructions:
  - type: ExecuteCommand
    command: "{{.Env.CONFIGURE_ENV_PREFIX}} cmake --build . --target sbom_source_verify -v"
    maxTimeInSeconds: 1800
    maxTimeBetweenOutput: 900
    userMessageOnFailure: >
      Source SBOM verification failed, see the log for details.
enable_if:
  condition: and
  conditions:
  - condition: runtime
    env_var: VERIFY_SOURCE_SBOM
    equals_value: "ON"
  - condition: property
    property: features
    contains_value: GenerateSBOM
