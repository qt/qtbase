type: Group
instructions:
  - type: Group
    instructions:
    - !include "{{qt/qtbase}}/run_license_check.yaml"
    enable_if:
      condition: property
      property: features
      contains_value: LicenseCheckV2
  - type: Group
    instructions:
      - !include "{{qt/qtbase}}/cmake_build_tests_in_test_stage.yaml"
      - !include "{{qt/qtbase}}/coin_module_test_template_common.yaml"
      - type: Group
        instructions:
          - !include "{{qt/qtbase}}/cmake_regular_test_instructions.yaml"
          - !include "{{qt/qtbase}}/coin_module_test_release_imx8_hw.yaml"
        enable_if:
          condition: or
          conditions:
            - condition: property
              property: host.os
              equals_property: target.os
            - condition: property
              property: target.osVersion
              in_values: [QEMU, IMX8, QNX_710, QNX_800, IOS_ANY]
            - condition: property
              property: features
              contains_value: AndroidTestRun
    disable_if:
      condition: or
      conditions:
        - condition: property
          property: features
          contains_value: DisableTests
        - condition: property
          property: features
          contains_value: LicenseCheckV2
        - condition: property
          property: features
          contains_value: DoNotRunTestsButCreateTestWorkItem
        - condition: runtime
          env_var: AXIVION_ANALYSIS
          equals_value: "1"
  - type: Group
    instructions:
      - !include "{{qt/qtbase}}/coin_module_axivion_template_v2.yaml"
    enable_if:
      condition: runtime
      env_var: AXIVION_ANALYSIS
      equals_value: "1"
