type: Group
instructions:
  - type: EnvironmentVariable
    variableName: HDC
    variableValue: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains/hdc"
  - type: EnvironmentVariable
    variableName: HARMONY_BROKER
    variableValue: "10.204.0.152"
  - type: EnvironmentVariable
    variableName: REMOTE_TOOLS_DIR
    variableValue: "/Users/qt/depot/ohos-scripts/test-runner"
  - type: EnvironmentVariable
    variableName: REMOTE_WORKING_DIR
    variableValue: "/Users/qt/work/{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}"
  # At the moment test runner uses relative path
  - type: EnvironmentVariable
    variableName: REMOTE_RESULTS_DIR
    variableValue: "../../../work/{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}/testresults"
  - type: EnvironmentVariable
    variableName: REMOTE_OUTPUT_DIR
    variableValue: "{{.Env.REMOTE_WORKING_DIR}}/output"
  - type: EnvironmentVariable
    variableName: REMOTE_RESULT_FILE
    variableValue: "{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}_RESULT.TXT"


  - type: ChangeDirectory
    directory: "{{.InstallDir}}/"
  - type: MakeDirectory
    directory: "{{.InstallDir}}/tests"
  - type: InstallTestBinaryArchive
    relativeStoragePath: "{{.Env.MODULE_ARTIFACTS_RELATIVE_STORAGE_PATH}}/tests.tar.gz"
    directory: "{{.InstallDir}}/tests"
    maxTimeInSeconds: 1200
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to install tests archive.
  - type: ChangeDirectory
    directory: "{{.InstallDir}}/target"
  - type: MakeDirectory
    directory: "qml"
  - type: ExecuteCommand
    command: "mv {{.InstallDir}}/tests/tests ."
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 14400
    userMessageOnFailure: >
      Failed to run tests.
  - type: ChangeDirectory
    directory: "{{.InstallDir}}"
  - type: ExecuteCommand
    command: "tar czf target.tar.gz {{.InstallDir}}/target"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 14400
    userMessageOnFailure: >
      Failed to run tests.

  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "rm -rf {{.Env.REMOTE_WORKING_DIR}}"]
    maxTimeInSeconds: 60
    maxTimeBetweenOutput: 60
    userMessageOnFailure: "Creating work dir failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "mkdir -p {{.Env.REMOTE_WORKING_DIR}}"]
    maxTimeInSeconds: 60
    maxTimeBetweenOutput: 60
    userMessageOnFailure: "Creating work dir failed!"
  - type: ExecuteCommand
    command: ["scp", "target.tar.gz", "qt@10.204.0.152:{{.Env.REMOTE_WORKING_DIR}}"]
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 14400
    userMessageOnFailure: >
      Failed to copy tests.
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "tar xzf {{.Env.REMOTE_WORKING_DIR}}/target.tar.gz --strip-components=4 -C {{.Env.REMOTE_WORKING_DIR}}"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Extracting test failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "rm -rf {{.Env.REMOTE_RESULTS_DIR}}"]
    maxTimeInSeconds: 60
    maxTimeBetweenOutput: 60
    userMessageOnFailure: "Cleaning testresults failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "rm -rf {{.Env.REMOTE_TOOLS_DIR}}/results"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Cleaning testresults failed!"

  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "{{.Env.REMOTE_TOOLS_DIR}}/build_hap.sh {{.Env.REMOTE_WORKING_DIR}}/target {{.Env.REMOTE_WORKING_DIR}}/target /Users/qt/depot/ohostemplateforqtapplication/ /Applications/DevEco-Studio.app /Users/qt/.local/opt/ohos/additional-packages/  {{.Env.REMOTE_OUTPUT_DIR}}/"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Building hap failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "{{.Env.REMOTE_TOOLS_DIR}}/install_hap.sh {{.Env.REMOTE_OUTPUT_DIR}}/entry-default-signed.hap {{.Env.HDC}}"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Installing hap failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "{{.Env.REMOTE_TOOLS_DIR}}/run_tests.sh {{.Env.REMOTE_OUTPUT_DIR}}/binaries.txt  {{.Env.HDC}} {{.Env.REMOTE_RESULTS_DIR}}"]
    maxTimeInSeconds: 21600
    maxTimeBetweenOutput: 1800
    userMessageOnFailure: "Running hap failed!"

  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "python3 {{.Env.REMOTE_TOOLS_DIR}}/generate_tests_report.py --binaries {{.Env.REMOTE_TOOLS_DIR}}/output/binaries.txt --output work/{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}/{{.Env.REMOTE_RESULT_FILE}} work/{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}/testresults"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Parsing test results failed!"
  - type: ExecuteCommand
    command: ["ssh", "qt@{{.Env.HARMONY_BROKER}}", "cat work/{{.Env.TESTED_MODULE_COIN}}_{{.Env.TESTED_MODULE_BRANCH_COIN}}/{{.Env.REMOTE_RESULT_FILE}}"]
    maxTimeInSeconds: 600
    maxTimeBetweenOutput: 600
    userMessageOnFailure: "Printing results failed!"

