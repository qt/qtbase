type: Group
instructions:
  - type: Group
    instructions:
      - type: EnvironmentVariable
        # This variable interferes with Android input tests
        # when forwarded by androidtestrunner.
        variableName: QT_IM_MODULE
        variableValue: ""
      # Modules can set ANDROID_EMULATOR_EXTRA_ARGS to append extra arguments to the
      # emulator runner command.
      - type: AppendToEnvironmentVariable
        variableName: ANDROID_EMULATOR_RUNNER
        variableValue: " {{.Env.ANDROID_EMULATOR_EXTRA_ARGS}}"
        enable_if:
          condition: runtime
          env_var: ANDROID_EMULATOR_EXTRA_ARGS
          not_equals_value: null
      - type: ExecuteCommand
        command: "{{.Env.ANDROID_EMULATOR_RUNNER}}"
        maxTimeInSeconds: 600
        maxTimeBetweenOutput: 300
        userMessageOnFailure: "Failed to start emulator, check coin log and testresults log files."
    enable_if:
      condition: property
      property: features
      contains_value: AndroidTestRun
