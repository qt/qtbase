type: Group
instructions:
  - type: Group
    instructions:
      - type: WriteFile
        fileContents: |
            #!/bin/bash
            RESULT=1 # 0 upon success
            TIMEOUT=240
            COUNT=0
            QEMUPID=0
            QEMUIPADDR="{{.Env.QNX_QEMU_IPADDR}}"
            mkqnximage --type=qemu --graphics=no --ip=${QEMUIPADDR} --build --run=-h </dev/null &>/dev/null & disown

            while [[ "QEMUPID" -eq 0 ]]
            do
                QEMUPID=`pidof qemu-system-x86_64`

                if [[ "QEMUPID" -eq 0 ]]; then
                    echo "QEMU not yet started, wait 1 sec."
                    COUNT=$((COUNT+1))
                    sleep 1
                else
                    echo "QEMU running with PID: $QEMUPID"
                fi

                if [[ "COUNT" -eq "TIMEOUT" ]]; then
                    echo "Timeout waiting QEMU to start"
                    exit 1
                fi
            done

            while :; do
                echo "Waiting QEMU SSH coming up"
                status=$(ssh -o PreferredAuthentications=publickey -o BatchMode=yes -o ConnectTimeout=1 ${QEMUIPADDR} echo ok 2>&1)
                RESULT=$?
                if [ $RESULT -eq 0 ]; then
                    echo "QEMU SSH Connected ok"
                    break
                fi
                if [ $RESULT -eq 255 ]; then
                    # connection refused also gets you here
                    if [[ $status == *"Permission denied"* ]] ; then
                        # permission denied indicates the ssh link is okay
                        echo "QEMU SSH server up"
                        RESULT=0
                        break
                    fi
                fi
                TIMEOUT=$((TIMEOUT-1))
                if [ $TIMEOUT -eq 0 ]; then
                    echo "QEMU SSH timed out"
                    exit $RESULT
                fi
                sleep 1
            done

            # QNX 8.0 mkqnximage no longer populates /etc/resolv.conf in
            # static-IP boot mode (dhcpcd never runs with --ip=). Without
            # this, DNS-dependent tests like tst_qhostinfo fail to resolve
            # *.test.qt-project.org. The -s guard makes this a no-op on
            # QNX 7.1, whose mkqnximage already provisions resolv.conf.
            ssh -o PreferredAuthentications=publickey -o BatchMode=yes \
                -o StrictHostKeyChecking=no ${QNX_QEMU_SSH} '
                if [ ! -s /etc/resolv.conf ]; then
                    mkdir -p /data/var/dhcpcd
                    {
                        d=$(getconf _CS_DOMAIN 2>/dev/null)
                        [ -n "$d" ] && [ "$d" != undefined ] && echo "search $d"
                        r=$(getconf _CS_RESOLVE 2>/dev/null)
                        if [ -n "$r" ] && [ "$r" != undefined ]; then
                            echo "$r" | sed "s/nameserver_/nameserver /"
                        else
                            # Fall back to the default gateway. On Coin this is
                            # the host VM bridge running dnsmasq on :53.
                            gw=$(netstat -rn 2>/dev/null | awk "/^default/ {print \$2; exit}")
                            [ -n "$gw" ] && echo "nameserver $gw"
                        fi
                    } > /data/var/dhcpcd/resolv.conf
                    chmod 644 /data/var/dhcpcd/resolv.conf
                fi'
            exit $RESULT
        filename: "{{.Env.QNX_QEMU}}/start_qnx_qemu.sh"
        fileMode: 493
      - type: ChangeDirectory
        directory: "{{.Env.QNX_QEMU}}"
      - type: ExecuteCommand
        command: "{{.Env.QNX_QEMU}}/start_qnx_qemu.sh"
        maxTimeInSeconds: 300
        maxTimeBetweenOutput: 100
        userMessageOnFailure: >
          Failed to start QNX qemu, check logs.
        disable_if:
          condition: property
          property: host.os
          equals_value: Windows
    enable_if:
      condition: and
      conditions:
        - condition: property
          property: target.os
          equals_value: QNX
        - condition: property
          property: features
          not_contains_value: DisableTests
