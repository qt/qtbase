#
# qmake configuration for win32-arm64ec-msvc
#
# Written for Microsoft C/C++ Optimizing Compiler targeting arm64ec.
#

include(../common/msvc-desktop.conf)

WINSDK_VER              = 10.0
VCPROJ_ARCH             = ARM64EC

DEFINES += WIN64
QMAKE_COMPILER_DEFINES += _WIN64

QMAKE_CFLAGS += /arm64EC
QMAKE_CXXFLAGS += /arm64EC /d2arm64ECMarkAllFuncsPatchable

load(qt_config)
