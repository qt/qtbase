// CMake-specific overrides for Qt Android library builds.
// Values are passed as command line properties (i.e. -Pproperty=<value>).
//
// Arguments:
//   buildDir        Build output directory
//   jarOutputDir    Where to write the extracted JAR
//   buildVariant    Either Debug or Release
//   includeJars     Comma-separated JAR dependencies
//   javacSource     Java source compatibility
//   javacTarget     Java target compatibility

allprojects {
    def buildDir = project.findProperty('buildDir')
    if (buildDir)
        layout.buildDirectory = file(buildDir)

    pluginManager.withPlugin('com.android.library') {
        android {
            def buildTools = findProperty('buildToolsVersion')
            if (buildTools) buildToolsVersion = buildTools

            compileOptions {
                def javaSource = findProperty('javacSource')
                def javaTarget = findProperty('javacTarget')
                if (javaSource) sourceCompatibility = JavaVersion.toVersion(javaSource)
                if (javaTarget) targetCompatibility = JavaVersion.toVersion(javaTarget)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ['-Xlint:all', '-Xdoclint:all,-missing']
        }
    }

    def includeJars = project.findProperty('includeJars')
    if (includeJars) {
        afterEvaluate {
            dependencies {
                includeJars.tokenize(',').each { compileOnly files(it) }
            }
        }
    }

    def variant = findProperty('buildVariant')
    def variantLower = variant?.toLowerCase()
    tasks.register("${rootProject.name}Jar", Copy) {
        def buildOutput = layout.buildDirectory
        def jarOut = findProperty('jarOutputDir')

        dependsOn "assemble${variant}"

        def outputDir = jarOut ? file(jarOut) : buildOutput.dir('libs').get().asFile
        def aarFile = buildOutput.file("outputs/aar/${rootProject.name}-${variantLower}.aar")

        from zipTree(aarFile)
        include 'classes.jar'
        into outputDir
        rename 'classes.jar', "${rootProject.name}.jar"
    }

    tasks.register("resolveDependencies") {
        // Assemble only in verify mode, composite builds might fail for relative dependencies.
        // FIXME: resolve tools dependencies (aapt2, lint-gradle) without full assemble.
        if (!gradle.startParameter.offline) {
            dependsOn "assemble${variant}"
        }

        doLast {
            project.configurations.findAll {
                if (!it.canBeResolved) return false
                // Only resolve the variant's own configurations.
                def name = it.name.toLowerCase()
                if (!name.startsWith(variantLower)) return false
                // Disable test variants to avoid ambiguity in single-projects.
                if (name.contains('test')) return false

                return true
            }.each { it.resolve() }
        }
    }
}
